<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arkay Succession Planning — Executive Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <div class="header-row">
      <div class="brand-lockup">
        <a href="https://www.linkedin.com/company/arkaypackaging/?viewAsMember=true" class="logo-link" target="_blank" rel="noopener noreferrer" aria-label="Arkay on LinkedIn">
          <img src="arkay-logo.png" alt="Arkay Packaging" class="site-logo" width="160" height="64" />
        </a>
        <div class="brand">Arkay Succession Planning</div>
      </div>
      <span class="date-pill" id="date-pill">Loading…</span>
    </div>
    <div class="toolbar">
      <div class="search-wrap">
        <span class="search-icon" aria-hidden="true">⌕</span>
        <input type="search" id="global-search" placeholder="Search all meetings (Steve, AI, accountability, Estée Lauder…)" autocomplete="off" aria-label="Search all succession meetings" />
        <div id="search-results" hidden></div>
      </div>
    </div>
    <nav class="month-bar" id="month-bar" aria-label="Select meeting month"></nav>
  </div>
</header>

<main>
  <div id="dashboard" aria-live="polite"></div>
</main>

<script src="app.js"></script>
</body>
</html>
